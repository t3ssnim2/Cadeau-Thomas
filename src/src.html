<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès au cadeau – Vérification en cours</title>
<style>
  :root{--bg:#0f1020;--card:#1b1d3a;--ink:#f4f4ff;--muted:#9a9cc8;--red:#ff4d5e;--green:#3ddc84;--yellow:#ffd23f;--blue:#4d7cff;--line:#2e3170}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:112px 14px 90px;background:radial-gradient(circle at 20% 10%,#23265a 0,transparent 40%),radial-gradient(circle at 90% 90%,#3a1a4a 0,transparent 40%),var(--bg);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  body.fc,body.fc *{cursor:none!important}
  body.noscroll{scrollbar-width:none}body.noscroll::-webkit-scrollbar{display:none}
  p{color:var(--muted);line-height:1.5;margin:8px 0}
  h1{font-size:1.3rem;margin:0 0 6px}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:var(--blue)}
  button:active{transform:scale(.97)}button[disabled]{opacity:.35;cursor:not-allowed}
  .big{width:100%;font-size:1.02rem;background:var(--green);color:#06210f;margin-top:12px}
  .sm{padding:5px 10px;font-size:.8rem}
  .card{width:100%;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 20px 60px #0008;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .badge{display:inline-block;font-size:.7rem;background:var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);margin-bottom:10px}
  .msg{min-height:1.3em;color:var(--red);font-weight:600;margin-top:8px}
  .ok{color:var(--green)}
  input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:2px solid var(--line);background:#0d0e22;color:var(--ink);margin:4px 0}
  label.f{display:block;font-size:.8rem;color:var(--muted);margin-top:8px}
  .scrollbox{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#0d0e22;margin:10px 0;-webkit-user-select:none}
  .row{display:block;padding:5px 0;font-size:.88rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .tile{aspect-ratio:1;font-size:2.2rem;display:flex;align-items:center;justify-content:center;background:#0d0e22;border:2px solid var(--line);border-radius:12px;cursor:pointer}
  .tile.sel{border-color:var(--yellow);background:#2b2a12}
  .bar{height:22px;border-radius:99px;background:#0d0e22;overflow:hidden;margin:14px 0 6px;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}
  .bar2{background:#3a2d00;color:var(--yellow);border-radius:10px;padding:8px 10px;font-size:.85rem;margin-bottom:10px}
  .shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  /* header */
  #hd{position:fixed;top:0;left:0;right:0;z-index:60;background:#0b0c1ad9;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.74rem;color:var(--muted)}
  #hd .sp{flex:1}
  #hd button{padding:4px 9px;font-size:.72rem;background:var(--line)}
  #giveup{background:#5a1e28!important}
  #crumb{position:fixed;top:58px;left:0;right:0;z-index:59;font-size:.68rem;color:#6c6fa0;padding:2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #crumb b{color:var(--ink)}
  #foot{position:fixed;bottom:0;left:0;right:0;z-index:58;background:#0b0c1ad9;border-top:1px solid var(--line);padding:6px 12px;font-size:.72rem;color:var(--muted);text-align:center;min-height:28px}
  #toasts{position:fixed;top:92px;right:10px;z-index:200;display:flex;flex-direction:column;gap:6px;max-width:min(320px,86vw);pointer-events:none}
  .toast{background:#262a5c;border:1px solid #444a9c;border-radius:12px;padding:9px 12px;font-size:.82rem;animation:in .3s}
  .toast.bad{background:#4a1822;border-color:#8c2c3d}.toast.gold{background:#3a3000;border-color:#8c7a1c;color:var(--yellow)}.toast.prize{background:#173a22;border-color:#2c8c4d}
  .ov{position:fixed;inset:0;background:#000b;z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%;position:relative}
  .mod .x{position:absolute;top:8px;right:10px;background:none;color:#6c6fa0;padding:2px 6px}
  #cookiebar{position:fixed;left:8px;right:8px;bottom:42px;z-index:120;background:#2a2d63;border:1px solid #5b61c9;border-radius:14px;padding:10px 40px 10px 12px;font-size:.8rem}
  #cookiebar .cx{position:absolute;top:2px;right:4px;background:none;font-size:.5rem;padding:2px 3px;color:#7f83c9}
  /* chat */
  #chatbtn{position:fixed;right:12px;bottom:46px;z-index:130;border-radius:99px;width:48px;height:48px;font-size:1.3rem;padding:0;background:var(--blue)}
  #chat{position:fixed;right:12px;bottom:104px;z-index:131;width:min(300px,88vw);background:var(--card);border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;overflow:hidden}
  #chat.on{display:flex}#chatlog{height:190px;overflow:auto;padding:8px;font-size:.8rem}
  #chatlog div{margin:4px 0;padding:6px 8px;border-radius:10px;background:#262a5c;max-width:90%}#chatlog .me{background:#1f4d3a;margin-left:auto}
  #fcur{position:fixed;z-index:300;font-size:1.4rem;pointer-events:none;display:none}
  body.fc #fcur{display:block}
  #fake{position:fixed;inset:0;z-index:400;background:#7a0010;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:monospace}
  canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:500}
  /* misc */
  .tiny{background:none;color:#5c5f90;font-size:.55rem;padding:2px;font-weight:400;text-decoration:underline}
  .sw{width:70px;height:34px;border-radius:99px;background:#0d0e22;border:2px solid var(--line);position:relative;cursor:pointer;display:block}
  .sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .25s}
  .stats{background:#0d0e22;border-radius:14px;padding:12px 16px;margin:16px 0;font-size:.92rem}
  .stats div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}.stats b{color:var(--ink)}
  .gift{font-size:4rem;text-align:center;animation:bounce 1s infinite}@keyframes bounce{50%{transform:translateY(-10px)}}
  .cert{border:4px double var(--yellow);border-radius:10px;padding:18px;text-align:center;background:#1d1a05}
  table.lb{width:100%;border-collapse:collapse;font-size:.9rem}table.lb td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .tall{position:relative}.tall .mark{position:absolute;left:0;right:0;text-align:center;color:#3b3e78;font-size:.9rem}
  #fscroll{position:fixed;right:2px;top:110px;bottom:60px;width:8px;background:#0d0e22;border-radius:6px;z-index:70;display:none}
  #fscroll i{position:absolute;left:0;right:0;height:40px;background:var(--blue);border-radius:6px}
  #uptop{position:fixed;left:10px;bottom:46px;z-index:70;display:none;background:var(--line)}
  /* mascotte */
  #mascot{position:fixed;z-index:140;left:20px;top:200px;width:76px;height:86px;pointer-events:none;transition:left 3.2s ease-in-out,top 3.2s ease-in-out}
  #mascot svg{width:100%;height:100%;overflow:visible;animation:mbob 1.4s ease-in-out infinite}
  #mascot.flip svg{transform:scaleX(-1);animation:none}
  #mascot.dance svg{animation:mdance .5s ease-in-out infinite}
  @keyframes mbob{50%{transform:translateY(-5px)}}
  @keyframes mdance{0%{transform:rotate(-14deg) translateY(0)}25%{transform:rotate(0) translateY(-14px)}50%{transform:rotate(14deg) translateY(0)}75%{transform:rotate(0) translateY(-14px)}100%{transform:rotate(-14deg) translateY(0)}}
  #mbub{position:absolute;bottom:92px;left:50%;transform:translateX(-50%) scale(.8);width:190px;background:#fff;color:#14152e;border-radius:14px;padding:8px 10px;font-size:.78rem;font-weight:600;line-height:1.3;opacity:0;transition:.2s;text-align:center;box-shadow:0 6px 20px #0006}
  #mbub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
  #mbub.on{opacity:1;transform:translateX(-50%) scale(1)}
  #mnote{position:absolute;top:-6px;right:-10px;font-size:1.2rem;display:none}
  #mascot.dance #mnote{display:block;animation:mbob .5s infinite}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 125%,rgba(255,70,0,calc(.5*var(--heat,0))),transparent 62%),radial-gradient(circle at 50% -15%,rgba(150,0,0,calc(.4*var(--heat,0))),transparent 52%);transition:background .6s}
  .toast.devil{background:#3b0a0a;border-color:#a01818;color:#ffb4a8}
  body.calm #mascot .horn{display:none}
</style>
</head>
<body>
<header id="hd">
  <span id="rage"></span><span id="prog"></span><span class="sp"></span>
  <span id="clock"></span><span id="view"></span>
  <button id="burger">☰</button><button id="giveup">J'abandonne</button>
</header>
<div id="crumb"></div>
<div id="toasts"></div>
<main id="stage"></main>
<div id="foot"></div>
<button id="chatbtn" title="Assistance">💬</button>
<div id="chat"><div id="chatlog"></div><input type="text" id="chatin" placeholder="Écrivez à Tess…" style="margin:0;border-radius:0;border-width:1px 0 0 0"></div>
<div id="fcur">👆</div>
<div id="fscroll"><i></i></div>
<button id="uptop">⬆ Remonter</button>
<div id="fake"><div><h1 style="font-size:2rem">ERREUR 404</h1><p style="color:#fff">cadeau_introuvable.exe a cessé de fonctionner.</p><p style="color:#ffd" id="fakeLine">Suppression du cadeau en cours…</p></div></div>
<div id="mascot" data-x="20"><div id="mbub"></div><span id="mnote">🎵</span>
<svg viewBox="0 0 80 90"><defs><radialGradient id="mg" cx="35%" cy="30%"><stop offset="0" stop-color="#c58bff"/><stop offset="1" stop-color="#6a3fd8"/></radialGradient></defs>
<ellipse cx="40" cy="86" rx="22" ry="4" fill="#0006"/>
<path d="M12 40 Q4 52 10 62" stroke="#6a3fd8" stroke-width="6" stroke-linecap="round" fill="none"><animate attributeName="d" dur=".6s" repeatCount="indefinite" values="M12 40 Q4 52 10 62;M12 40 Q2 30 8 22;M12 40 Q4 52 10 62"/></path>
<path d="M68 40 Q76 52 70 62" stroke="#6a3fd8" stroke-width="6" stroke-linecap="round" fill="none"><animate attributeName="d" dur=".6s" begin=".3s" repeatCount="indefinite" values="M68 40 Q76 52 70 62;M68 40 Q78 30 72 22;M68 40 Q76 52 70 62"/></path>
<rect x="26" y="68" width="8" height="14" rx="4" fill="#4b2aa8"/><rect x="46" y="68" width="8" height="14" rx="4" fill="#4b2aa8"/>
<path class="horn" d="M16 24 L10 4 L30 16Z" fill="#ff3b3b"/><path class="horn" d="M64 24 L70 4 L50 16Z" fill="#ff3b3b"/><path class="horn" d="M62 78 Q80 82 76 66 L72 70 Q72 76 62 74Z" fill="#ff3b3b"/><ellipse cx="40" cy="42" rx="28" ry="30" fill="url(#mg)"/>
<ellipse cx="30" cy="38" rx="8" ry="9" fill="#fff"/><ellipse cx="50" cy="38" rx="8" ry="9" fill="#fff"/>
<circle cx="32" cy="40" r="4" fill="#14152e"/><circle cx="52" cy="40" r="4" fill="#14152e"/>
<path d="M20 27 L38 31" stroke="#14152e" stroke-width="3" stroke-linecap="round"/><path d="M60 27 L44 33" stroke="#14152e" stroke-width="3" stroke-linecap="round"/>
<path d="M28 56 Q42 66 54 54" stroke="#14152e" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div>
<canvas id="cf"></canvas>

<script>
(()=>{
"use strict";
/* ================= CONFIG ================= */
const CFG={NAME:"Thomas",FULL:"Thomas Besse",AGE:26,
  FINAL_B64:"__FINAL__",
  SECRET_HASH:__HASH__,
  WAIT:1   // multiplicateur des temps d'attente
};
/* ============== OUTILS ============== */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}kids.flat().forEach(c=>{if(c!=null)e.append(c instanceof Node?c:document.createTextNode(c))});return e}
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[ri(0,a.length-1)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hash=s=>{let x=5381;for(const c of s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim())x=((x<<5)+x+c.charCodeAt(0))>>>0;return x};
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'};
const ST={fails:0,start:Date.now(),cheats:0,ach:new Set()};
const STAGE=$('#stage');
let idx=0,cleaners=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);cleaners.push(()=>clearTimeout(t));return t};
const every=(fn,ms)=>{const t=setInterval(fn,ms);cleaners.push(()=>clearInterval(t));return t};
const on=(t,ev,fn,o)=>{t.addEventListener(ev,fn,o);cleaners.push(()=>t.removeEventListener(ev,fn,o))};
const W=ms=>ms*CFG.WAIT;

function toast(msg,cls='',ms=3600){const t=h('div',{class:'toast '+cls},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),ms)}
function shake(el){el=el||STAGE;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function ach(id,txt){if(ST.ach.has(id))return;ST.ach.add(id);toast('🏅 Succès : '+txt,'gold',5000)}
const DEVILT=["Ton âme est sur la liste d'attente.","L'enfer, c'est les autres. Surtout moi.","Tu veux que j'appelle ta mère ?","Tu progresses. Vers le bas.","J'adore quand tu essaies.","C'est ça, continue. Je note tout.","Chaque échec me réchauffe le cœur.","Pas de bol. Enfin si, c'était prévu."];
function fail(msg,el){ST.fails++;if(msg)toast(msg,'bad');if(Math.random()<(msg?.12:.4))toast('😈 '+pick(DEVILT),'devil',4200);shake(el);try{mReact('fail')}catch(e){}
  [[1,'Première erreur. Ça commence bien.'],[10,'10 échecs : l’échauffement'],[25,'25 échecs : tu y mets du tien'],[50,'50 échecs : respect'],[100,'100 clics ratés : le champion du monde']].forEach(([n,t])=>{if(ST.fails>=n)ach('f'+n,t)})}
const polite=()=>idx<7;
const M=(a,b)=>polite()?a:b;
function card(title,...kids){const c=h('div',{class:'card'},h('span',{class:'badge'},'Étape '+(idx+1)),h('h1',{},title),...kids);STAGE.append(c);return c}
const once=f=>{let d=false;return(...a)=>{if(d)return;d=true;return f(...a)}};
function seq(fns,done){let i=0;const nx=()=>{if(i>=fns.length)return done();STAGE.innerHTML='';window.scrollTo(0,0);fns[i++](once(nx))};nx()}
function modal(...kids){const o=h('div',{class:'ov'},h('div',{class:'mod'},...kids));document.body.append(o);return o}
async function typeText(el,text,typos=true,fast=false){el.textContent='';for(let i=0;i<text.length;i++){if(typos&&!fast&&Math.random()<.04&&/[a-z]/.test(text[i])){el.textContent+=String.fromCharCode(text.charCodeAt(i)+1);await sleep(220);el.textContent=el.textContent.slice(0,-1)}el.textContent+=text[i];await sleep(fast?rnd(6,18):rnd(18,55))}}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffd23f','#ff4d5e','#3ddc84','#4d7cff','#ff7bd5'];
  const ps=Array.from({length:200},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,vy:2+Math.random()*4,vx:(Math.random()-.5)*3,c:pick(cols),a:Math.random()*6}));let t=0;
  (function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a+=.05);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++t<650)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* ============== ÉLÉMENTS GLOBAUX ============== */
// compteur de rage (91)
setInterval(()=>{const dp=Math.min(99,Math.round(ST.fails*1.5+ST.cheats*5));if(!document.body.classList.contains('calm'))document.documentElement.style.setProperty('--heat',Math.min(1,ST.fails/70));$('#rage').textContent=`❌ ${ST.fails} échecs · ⏱ ${fmt(Date.now()-ST.start)} · 🕵️ ${ST.cheats} triches · 🔥 damnation ${dp}%`;
  const m=(Date.now()-ST.start)/60000;if(m>=5)ach('t5','5 minutes de ta vie');if(m>=10)ach('t10','10 minutes : tu es têtu');if(m>=20)ach('t20','20 minutes ?! Tu es fou')},1000);
// progression menteuse (83)
function lbl(){$('#prog').textContent=idx>=STAGES.length-2?'Plus que 1 étape (menteur)':(idx%5===4?'Plus que 3 étapes (j\'ai menti)':'Plus que 2 étapes')}
// fil d'Ariane en spirale (75)
function crumb(){const base=['Accueil','Salon','Cuisine','Accueil','Salon','Cuisine','Cave','Accueil'];const n=Math.min(idx+2,14);const arr=Array.from({length:n},(_,i)=>base[i%base.length]);
  $('#crumb').innerHTML=arr.map((x,i)=>i===n-1?'<b>'+x+'</b>':x).join(' › ')}
// horloge fausse (86)
let clkOff=0;setInterval(()=>{if(Math.random()<.3)clkOff=ri(-9,9)*3600000+ri(0,59)*60000;const d=new Date(Date.now()+clkOff);let t=d.toLocaleTimeString('fr-FR');if(Math.random()<.08)t='25:61:'+String(ri(10,99));$('#clock').textContent='🕒 '+t},1000);
// spectateurs (85)
let viewers=3;setInterval(()=>{viewers=Math.random()<.12?0:Math.max(1,viewers+ri(-2,3));$('#view').textContent=`👀 ${viewers} personne${viewers>1?'s':''} regarde${viewers>1?'nt':''} cette page`},2500);
// prix fictif (87)
setInterval(()=>toast('🏆 '+CFG.FULL+' a gagné un prix !','prize',3000),20000);
// témoignages (84)
const TEMOS=["« J'ai mis 3 jours, je recommande. » — Kevin, 41 ans","« Mon écran a survécu de justesse. » — Sandrine","« Pire expérience de ma vie, 5 étoiles. » — Jean-Pierre","« Je l'ai fait en pleurant. » — Anonyme","« Le bouton m'a insulté. » — Mehdi","« Mieux qu'un escape game. » — Lucie (elle a abandonné)"];
let ti=0;const showT=()=>{$('#foot').textContent=TEMOS[ti++%TEMOS.length]};showT();setInterval(showT,9000);
// bandeau cookies qui revient (4,5)
function cookieBar(){if($('#cookiebar')||document.querySelector('.ov'))return;let d=0;const bar=h('div',{id:'cookiebar'},'🍪 Nous avons mis à jour nos cookies. ',h('button',{class:'sm',onclick:()=>{bar.remove();toast('Merci. (On les avait déjà.)')}},'Tout accepter'));
  const x=h('button',{class:'cx'},'✖');const mv=()=>{if(d++<4){x.style.top=ri(0,40)+'px';x.style.right=ri(0,200)+'px'}else x.onclick=()=>bar.remove()};x.addEventListener('mouseenter',mv);x.addEventListener('touchstart',e=>{if(d<4){e.preventDefault();mv()}},{passive:false});bar.append(x);document.body.append(bar)}
setInterval(cookieBar,80000);
// menu hamburger imbriqué (74)
function burger(d=0){const o=modal(h('button',{class:'x',onclick:()=>o.remove()},'✖'),h('h1',{},'Menu niveau '+(d+1)),
  d<3?h('button',{onclick:()=>{o.remove();burger(d+1)}},'☰ Plus d\'options'):h('p',{},'Rien ici. Vraiment rien.'))}
$('#burger').onclick=()=>burger();
// j'abandonne (97)
$('#giveup').onclick=()=>{const o=modal(h('h1',{},'Abandonner ?'),h('p',{},'Tu perdras ta progression et reviendras à l\'étape 3.'),

  (nx)=>{let n=0;const a=h('button',{style:'flex:1;background:var(--green);color:#06210f'},'Oui'),b=h('button',{style:'flex:1;background:var(--red)'},'Non');
    const sw=()=>{if(n<3){const t=a.textContent;a.textContent=b.textContent;b.textContent=t}};

      else{if(t0&&now-t0<1000){cnt=0;info.textContent='Trop rapide ! 0/10';fail()}else{cnt++;info.textContent=cnt+'/10'}t0=now;if(cnt>=10)nx()}};
    card('👆 Rapide puis lent',info,b)},
  (nx)=>{let fails=0,tm=null,t=0;const b=h('button',{class:'big',style:'padding:24px'},'Maintiens appuyé 15 s'),f=h('i'),bar=h('div',{class:'bar'},f),info=h('p',{});
    const stop=()=>{clearInterval(tm);tm=null;f.style.width='0'};const need=()=>fails>=2?9:15;

    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(tm){stop()}}));cleaners.push(stop);

  (nx)=>{let n=0;const skip=h('button',{style:'width:100%;padding:18px;background:#444a9c'},'Passer'),real=h('button',{style:'position:absolute;left:0;bottom:0;width:48px;height:48px;opacity:.02;padding:0'},'⏭');

    const c=card('⏭ Passer l\'épreuve',h('p',{},'Bouton « Passer » disponible ci-dessous.'),skip);c.style.position='relative';c.style.paddingBottom='60px';c.append(real)},
  (nx)=>{let last=0,fails=0;const b=h('button',{class:'big',style:'padding:24px'},'Double-clique en moins de 200 ms');
    b.onclick=()=>{const now=Date.now(),g=now-last;last=now;if(g<30)return;if(g<=(fails>=4?420:200))nx();else if(g<1200){fails++;fail(`${g} ms. Trop lent.`)}};card('⚡ Double clic',b)},
  (nx)=>{let n=0;const b=h('button',{class:'big',style:'transition:transform .15s'},'Clique-moi (8×)');b.onclick=()=>{n++;if(n>=8)return nx();b.style.transform=`scale(${Math.pow(.78,n)})`;b.textContent=`${n}/8`};card('🔬 Bouton qui rétrécit',b)},
  (nx)=>{let n=0;const mk=()=>{STAGE.innerHTML='';card('🧭 Confirmation',h('p',{},'Que souhaitez-vous faire ?'),
      h('button',{class:'big',style:'background:var(--red);color:#fff',onclick:()=>{toast('Annulé… enfin, validé quand même 😈');nx()}},'Annuler'),
      h('button',{class:'big',style:'background:var(--line);color:#fff',onclick:()=>{toast('Retour 3 épreuves en arrière.','bad');back()}},'Retour'),
      h('button',{class:'big',onclick:()=>{const o=modal(h('h1',{},'Êtes-vous sûr ?'),h('p',{},'Vraiment sûr ? Même pas un peu ?'),h('button',{class:'big',onclick:()=>{o.remove();nx()}},'Oui')) }},'Valider'))};mk()},
  (nx)=>{let s=0;const b=h('button',{class:'big',style:'transition:transform .2s;transform-origin:left center'},'Je grossis');const mk=()=>{b.onmouseenter=()=>{s++;b.style.transform=`scale(${1+s*.25})`}};mk();
    b.onclick=()=>s>=4?nx():fail('Trop petit pour être cliqué. Attends qu\'il grossisse.');card('🎈 Bouton qui grossit',h('p',{},'Survole-le puis clique.'),h('div',{style:'height:50px;overflow:visible'},b),h('div',{style:'height:70px'}))},
  (nx)=>{let n=0;const knob=h('i'),sw=h('span',{class:'sw'},knob);let on_=false;sw.onclick=()=>{n++;if(n>=6){knob.style.left='39px';return setTimeout(nx,500)}knob.style.left='21px';setTimeout(()=>knob.style.left='3px',350);fail()};

/* ---- scroll ---- */
function sScroll(done){
  document.body.classList.add('noscroll');
  const fns=[
  (nx)=>{const line=h('div',{style:'overflow-x:auto;white-space:nowrap;font-size:5px;color:var(--muted);padding:6px;border:1px solid var(--line);border-radius:8px'});
    line.textContent=('Le texte est minuscule et très long, fais défiler vers la droite pour trouver le bouton. ').repeat(120);
    const end=h('button',{class:'sm',style:'margin-left:12px',onclick:nx},'SUIVANT');line.append(end);
    card('🔬 Lecture attentive',h('p',{},'Fais défiler horizontalement le texte jusqu\'au bout pour trouver le bouton « suivant ».'),line)},
  (nx)=>{
    const fs=$('#fscroll'),thumb=$('i',fs),up=$('#uptop');fs.style.display='block';up.style.display='block';up.onclick=()=>window.scrollBy(0,-10);
    let H=14000,grown=0,prev=0;const tall=h('div',{class:'tall',style:`height:${H}px`});
    for(let y=300;y<H;y+=300)tall.append(h('div',{class:'mark',style:`top:${y}px`},y%3000===0?`↓ continue ↓ (${Math.round(y/H*100)} %)`:'· · ·'));
    const bt=h('button',{class:'big',style:'position:absolute;bottom:20px;left:10%;width:80%'},'Suivant');tall.append(bt);
    const upd=()=>{const mx=document.documentElement.scrollHeight-innerHeight;const r=mx>0?scrollY/mx:0;thumb.style.top=((1-r)*(fs.clientHeight-40))+'px'};
    on(window,'wheel',e=>{if(!e.ctrlKey){e.preventDefault();window.scrollBy(0,-e.deltaY)}},{passive:false});
    on(window,'scroll',()=>{const mx=document.documentElement.scrollHeight-innerHeight;
      if(mx-scrollY<3000&&scrollY>prev){const d=(scrollY-prev)*.65;window.scrollTo(0,prev+Math.max(2,d))}
      if(mx-scrollY<120&&grown<4){grown++;H+=1800;tall.style.height=H+'px';toast('Le bas recule…','bad')}
      prev=scrollY;upd()});
    bt.onclick=()=>{fs.style.display='none';up.style.display='none';nx()};cleaners.push(()=>{fs.style.display='none';up.style.display='none'});
    card('📜 Longue page',h('p',{},'Fais défiler la page jusqu\'en bas. (Dans le bon sens.)')); STAGE.append(tall);upd()}];
  cleaners.push(()=>document.body.classList.remove('noscroll'));
  seq(fns,()=>{document.body.classList.remove('noscroll');done()})}

/* ---- pages ---- */
function sPages(done){
  let n=0;const body=h('div',{});
  const show=(label)=>{body.innerHTML='';body.append(h('p',{style:'color:var(--ink);font-weight:700;text-align:center'},'Page 1/12'),h('p',{},label||'Contenu de la page. (Il n\'y a rien d\'intéressant.)'))};show();
  const pg=h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0'});
  const mk=()=>{pg.innerHTML='';for(let i=1;i<=12;i++)pg.append(h('button',{class:'sm',style:'background:var(--line)',onclick:()=>{n++;if(n>=8){pg.innerHTML='';pg.append(h('button',{class:'big',onclick:done},'Terminer (page 12/12)'));show('Page 12/12 : enfin !');return}show(`Tu as cliqué sur la page ${i}, mais voici la page 1.`);fail()}},i))};mk();
  card('📖 Pagination',h('p',{},'Rends-toi à la dernière page.'),body,pg)}

/* ---- code secret ---- */
function sCode(done){let t=0;const H=['Indice : c\'est un mot.','Indice : il y a des lettres dedans.','Indice : ce n\'est pas « mot de passe ».','Indice : il fait plus de trois lettres.','Indice : ce n\'est pas ce que tu crois.','Indice : c\'est un code que vous utilisez pour les appels, tous les deux.'];

function fFake(done){const p=h('h1',{style:'min-height:3em;font-size:1.5rem'});card('🎉',p,h('p',{id:'ff'}));
  (async()=>{await typeText(p,'Félicitations '+CFG.NAME+', tu as terminé !',false);confetti();await sleep(1800);p.textContent+=' Mais';await sleep(1000);for(let i=0;i<p.textContent.length&&p.textContent.length>3;i++){p.textContent=p.textContent.slice(0,-1);await sleep(40)}

function fRank(done){const rows=[['1','Mamie Paulette','00:07'],['2','Un chat','00:11'],['3','Gérard (le hamster)','00:19'],['4','Tess (bot)','00:21'],['5',CFG.FULL,fmt(Date.now()-ST.start)]];

function fPact(done){let d=0;const items=["J'accepte de céder mon âme","J'accepte de céder mon canapé","J'accepte de céder mes week-ends"].map(t=>{const c=h('input',{type:'checkbox'});return [c,h('label',{class:'row',style:'font-size:.95rem;color:var(--ink)'},c,' '+t)]});

function fReal(){document.body.classList.add('calm');document.documentElement.style.setProperty('--heat',0);setTimeout(()=>mSay('Bon… je range les cornes. Joyeux anniversaire, '+CFG.NAME+' ❤️',9000),4000);

    h('button',{class:'big',onclick:()=>{toast('Niveau 2 débloqué… rendez-vous l\'an prochain 😈','gold',6000);confetti()}},'⭐ Passer au niveau supérieur'));
  confetti();typeText(p,msg,false,true);try{localStorage.removeItem('tb_idx')}catch(e){}}

const STAGES=[sIntro,sCookies,sPopups,sCGU,sBirth,sForm,sCaptchas,sQuiz,sGames,sWait,sGauntlet,sScroll,sPages,sCode,fFake,fCert,fRank,fMail,fPact,fReal];
const WHISP=["Bienvenue. Entre, entre. Ne regarde pas derrière toi.","Les cookies, c'est comme mes contrats : on les accepte sans lire.","Quelques formalités. Je te promets : rien de grave. (Si.)","Lis tout. J'ai mis un piège à la page 7.","Dis ton âge. Je saurai si tu mens. Je sais tout.","Un joli formulaire. J'adore les formulaires.","Prouve que tu es humain. Moi, j'ai arrêté.","Un quiz ! Je les aime truqués.","Des jeux. Tu perdras. C'est un classique.","Patience… c'est ma spécialité. Et pas la tienne.","Des boutons. Des boutons qui fuient. C'est moi qui les pousse.","Défile. Défile encore. Je te regarde de bas en haut.","Page 1 sur 12. Ou pas.","Le code secret : ton dernier espoir. Spoiler : tu l'as.","Tu as presque fini. Presque. J'adore ce mot.","Un diplôme ! Signé de ma main griffue.","Dernier de la classe. Comme à la maternelle.","Un mail. Un mail qui n'arrive pas.","Un dernier petit pacte. Pour la forme.",""];
function save(){try{localStorage.setItem('tb_idx',String(idx))}catch(e){}}
function load(i){cleaners.forEach(f=>f());cleaners=[];document.body.classList.remove('fc','noscroll');document.querySelectorAll('.ov').forEach(o=>o.remove());idx=i;save();STAGE.innerHTML='';window.scrollTo(0,0);crumb();lbl();if(i>0&&i<STAGES.length-1&&Math.random()<.6)setTimeout(()=>mReact('stage'),900);if(WHISP[i]&&i<STAGES.length-1)setTimeout(()=>toast('😈 « '+WHISP[i]+' »','devil',6500),600);if(i>2&&i<STAGES.length-3&&Math.random()<.25)setTimeout(()=>{if(!document.querySelector('.ov'))surveyRound(0)},2500);
  STAGES[i](once(()=>{if(i<STAGES.length-1){toast(pick(['Ne ferme pas cette page.','Ne ferme pas cette page. Je le saurai.','Tu ne peux plus fermer cette page. Ton âme est dessus.']));load(i+1)}}))}
let start=0;try{start=+localStorage.getItem('tb_idx')||0}catch(e){}
const dm=location.hash.match(/^#debug-(\d+)$/);if(dm)start=Math.min(+dm[1],STAGES.length-1);
